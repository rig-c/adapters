name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun without OS package dependencies
        run: |
          npm install --global bun@1.4.4
          bun --version
          bun --revision
      - run: bun install --frozen-lockfile
      - run: bun run build:libraries
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check:packages
      - run: bun run fetch-assets
      - name: Check bundled Playwright browsers and rejection controls
        run: bun scripts/check-playwright-image.mjs
      - run: bun run check:release
      - run: bun run smoke
      - name: Prepare immutable Pixi origin baseline
        run: |
          bun scripts/prepare-pixi-baseline.mjs \
            --commit 78e696b41fc07552a4861dde84cd8c85148cb8c4 \
            --pixi-sha256 82305b7cb154571c2f25d8b5dd4a57e4262c535abb57046080703ac7a299834e \
            --index-sha256 f4a3f5d572a60c877eb0a9b7400b9066fc74819e2ea48b9e674118662181f945 \
            --out "$RUNNER_TEMP/pixi-origin-baseline"
          echo "PIXI_BASELINE_BUNDLE=$RUNNER_TEMP/pixi-origin-baseline/origin-browser.mjs" >> "$GITHUB_ENV"
      - run: bun run test
      - run: bun run test:bench
      - run: bun run bench -- --smoke --json
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
