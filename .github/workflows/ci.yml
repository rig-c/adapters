name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build:libraries
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run check:packages
      - run: bun run fetch-assets
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run check:release
      - run: bun run smoke
      - run: bun run test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
