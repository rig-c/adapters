name: release
on:
  push:
    tags: ['pixi-v*', 'phaser-v*', 'three-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing package tag; dispatch with --ref matching this tag'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=$(bun scripts/release-plan.mjs)
          echo "packages=$plan" >> "$GITHUB_OUTPUT"
          echo "Publication plan: $plan"
      - if: vars.ADAPTERS_PUBLISH_ENABLED != 'true'
        run: echo 'PUBLISH_DISABLED — owner must enable ADAPTERS_PUBLISH_ENABLED.'
  publish:
    needs: plan
    if: needs.plan.outputs.packages != '[]' && vars.ADAPTERS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.package.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@12.2.2
          npm --version
      - run: bun install --frozen-lockfile
      - run: bun run build:libraries
      - run: bun run check:packages
      - name: Publish released package with provenance
        env:
          ADAPTERS_PUBLISH_ENABLED: ${{ vars.ADAPTERS_PUBLISH_ENABLED }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-plan.mjs --execute
