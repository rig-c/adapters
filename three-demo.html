<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>rig-c in Three.js</title><style>
body{margin:0;background:#14161a;color:#edf0f5;font:15px system-ui}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:baseline;gap:24px}a{color:#86baff}h1{font-size:26px}section{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:16px 0}label{display:flex;gap:8px;align-items:center}select,input,button{font:inherit;background:#252d3a;color:inherit;border:1px solid #566177;border-radius:6px;padding:7px}canvas{display:block;width:100%;max-height:70vh;object-fit:contain;border:1px solid #343c4b;border-radius:10px}#error{color:#ffb7a8}p{color:#bcc6d6;line-height:1.5}
</style></head><body><main><header><h1>rig-c in Three.js</h1><a href="/">Pixi demo</a></header><p>A rig built with rig-c, played as native meshes in a Three.js scene. Choose a camera and move through the animation.</p><section><label>Rig <select id="rig"><option>walk</option><option>flex</option><option>ride</option><option>figure</option><option>glow</option><option>duo</option><option>turned</option></select></label><label>Animation <select id="animation"></select></label><label>Camera <select id="view"><option value="orthographic">Orthographic</option><option value="perspective">Perspective</option></select></label><label>Instances <input id="count" type="number" min="1" max="10" value="1"></label><label>Speed <input id="speed" type="number" min="0" max="4" step="0.25" value="1"></label><button id="toggle">Pause</button></section><label>Time <input id="time" type="range" min="0" max="10" step="0.001" style="flex:1"><output id="clock">0.000 s</output></label><div id="stage"></div><p id="error"></p></main><script type="module" src="/src/three-demo.ts"></script></body></html>
